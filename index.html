
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101018">
<title>SESMOD AI STUDIO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#f7f5ff;font-family:system-ui,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #302c40}
.logo{font-size:21px;font-weight:900;letter-spacing:3px}
.logo small{display:block;font-size:10px;color:#a78bfa;letter-spacing:4px}
#auth{max-width:440px;margin:45px auto;padding:20px}
.panel{background:#1b1a27;border:1px solid #373248;border-radius:17px;padding:20px}
input,textarea,select{width:100%;padding:13px;margin:8px 0 14px;background:#101018;color:white;border:1px solid #484158;border-radius:10px}
textarea{resize:vertical}
button.primary{background:linear-gradient(100deg,#7655e8,#a05eea);color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700}
button.secondary{background:#302a43;color:white;border:1px solid #554a70;border-radius:10px;padding:11px}
button.danger{background:#612d3b;color:white;border:1px solid #9b435b;border-radius:10px;padding:11px}
.full{width:100%}
.tabs{display:flex;gap:8px;margin:15px 0}
.tabs button{flex:1}
#workspace{max-width:950px;margin:auto;padding:20px}
.welcome{padding:24px 4px}
.welcome h1{font-size:27px;margin-bottom:5px}
.muted{color:#aaa5bb;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{background:#1b1a27;border:1px solid #373248;border-radius:15px;padding:18px;text-align:left;color:white;min-height:120px}
.tool b{display:block;margin:10px 0 5px;font-size:16px}
.tool span{color:#aaa5bb;font-size:12px}
.symbol{font-size:25px}
#editor{margin-top:20px}
#message,#toolMessage{color:#c5b5ff;font-size:13px;min-height:20px;margin:10px 0}
.project{background:#242133;border:1px solid #403851;border-radius:12px;padding:15px;margin:10px 0}
.project button{margin-top:10px}
.hidden{display:none!important}
footer{text-align:center;color:#777185;font-size:11px;padding:25px}
.result{background:#101018;border:1px solid #484158;border-radius:10px;padding:14px;margin-top:15px}
.result h3{margin-top:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{flex:1;min-width:110px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){#workspace{padding:12px}.panel{padding:15px}.welcome h1{font-size:24px}}
</style>
</head>
<body>

<header>
<div class="logo">SESMOD<small>AI STUDIO</small></div>
<button class="secondary hidden" id="logout">Çıkış Yap</button>
</header>

<section id="auth">
<div class="panel">
<h2>SESMOD hesabına giriş</h2>
<div class="tabs">
<button type="button" class="primary" id="loginTab">Giriş Yap</button>
<button type="button" class="secondary" id="signupTab">Hesap Oluştur</button>
</div>
<form id="authForm">
<label>E-posta</label>
<input id="email" type="email" required placeholder="E-posta adresin">
<label>Şifre</label>
<input id="password" type="password" minlength="6" required placeholder="En az 6 karakter">
<button type="submit" class="primary full" id="submit">Giriş Yap</button>
</form>
<div style="text-align:center;margin:15px 0">veya</div>
<button type="button" class="secondary full" id="googleLogin">Google ile giriş yap</button>
<div id="message"></div>
</div>
</section>

<main id="workspace" class="hidden">
<div class="welcome">
<p class="muted">YARATICI ÜRETİM MERKEZİ</p>
<h1>Üretmeye başla.</h1>
<p class="muted" id="welcomeEmail"></p>
</div>

<h3>Yapay zekâ araçları</h3>
<div class="grid">
<button class="tool" onclick="openTool('music')">
<div class="symbol">🎵</div><b>AI Müzik</b>
<span>Şarkı ve müzik üretim hazırlığı</span>
</button>
<button class="tool" onclick="openTool('lyrics')">
<div class="symbol">✍️</div><b>AI Şarkı Yazarı</b>
<span>Özgün söz ve türkü yazımı</span>
</button>
<button class="tool" onclick="openTool('image')">
<div class="symbol">🎨</div><b>AI Görsel</b>
<span>Kapak ve afiş fikirleri</span>
</button>
<button class="tool" onclick="openTool('video')">
<div class="symbol">🎬</div><b>AI Video</b>
<span>Klip ve kısa film fikirleri</span>
</button>
<button class="tool" onclick="openTool('projects')">
<div class="symbol">📁</div><b>Projelerim</b>
<span>Kaydedilen çalışmalar</span>
</button>
<button class="tool" onclick="openTool('account')">
<div class="symbol">👤</div><b>Hesabım</b>
<span>SESMOD hesap bilgileri</span>
</button>
</div>

<section id="editor" class="panel hidden">
<h2 id="toolTitle">AI STUDIO</h2>
<p class="muted" id="toolDescription"></p>
<div id="toolContent"></div>
<div id="toolMessage"></div>
<button class="secondary" onclick="closeTool()">← Ana panele dön</button>
</section>
<footer>SESMOD AI STUDIO © 2026</footer>
</main>

<script>
const SUPABASE_URL="https://izlwpgepxyzzzsvfcuph.supabase.co";
const SUPABASE_KEY="sb_publishable_1tRMEPEDJgHb3rz1PF4lag_2Um3_jZl";

let db=null;
let mode="login";
let currentUser=null;
let lastMusicPrompt="";

const $=id=>document.getElementById(id);

function msg(t){$("message").textContent=t}
function toolMsg(t){$("toolMessage").textContent=t}

function connectionCheck(){
  if(!db){msg("Bağlantı kurulamadı. Sayfayı yenile.");return false}
  return true;
}

function showDashboard(user){
  currentUser=user;
  $("auth").classList.add("hidden");
  $("workspace").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("welcomeEmail").textContent=user.email||"";
}

function showLogin(){
  currentUser=null;
  $("workspace").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("auth").classList.remove("hidden");
}

$("loginTab").onclick=()=>{
  mode="login";
  $("submit").textContent="Giriş Yap";
  msg("");
};

$("signupTab").onclick=()=>{
  mode="signup";
  $("submit").textContent="Hesap Oluştur";
  msg("");
};

$("authForm").onsubmit=async e=>{
  e.preventDefault();
  if(!connectionCheck())return;
  $("submit").disabled=true;
  msg("İşlem yapılıyor...");

  try{
    const email=$("email").value.trim();
    const password=$("password").value;
    const result=mode==="signup"
      ?await db.auth.signUp({email,password})
      :await db.auth.signInWithPassword({email,password});

    if(result.error)throw result.error;

    if(mode==="signup"&&!result.data.session){
      msg("Kayıt oluşturuldu. E-postanı doğrula, ardından giriş yap.");
    }else if(result.data.user){
      showDashboard(result.data.user);
    }
  }catch(err){
    msg(err.message||"Bir hata oluştu.");
  }finally{
    $("submit").disabled=false;
  }
};

$("googleLogin").onclick=async()=>{
  if(!connectionCheck())return;
  msg("Google giriş sayfası açılıyor...");
  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:window.location.origin}
  });
  if(error)msg(error.message);
};

$("logout").onclick=async()=>{
  if(!connectionCheck())return;
  const {error}=await db.auth.signOut();
  if(error){toolMsg(error.message);return}
  showLogin();
};

const tools={
  music:["AI Müzik","Şarkını oluşturmak için bilgileri doldur."],
  lyrics:["AI Şarkı Yazarı","Şarkı yazım projenin konusunu anlat."],
  image:["AI Görsel","Oluşturmak istediğin görseli tarif et."],
  video:["AI Video","Oluşturmak istediğin videoyu tarif et."],
  projects:["Projelerim","Hesabına kaydedilen projeler."],
  account:["Hesabım","SESMOD hesap bilgilerin."]
};

window.openTool=async type=>{
  if(!currentUser||!connectionCheck()||!tools[type])return;

  $("editor").classList.remove("hidden");
  $("toolTitle").textContent=tools[type][0];
  $("toolDescription").textContent=tools[type][1];
  $("toolMessage").textContent="";
  $("toolContent").innerHTML="";

  if(type==="projects"){
    await loadProjects();
    return;
  }

  if(type==="account"){
    $("toolContent").innerHTML=`
      <h3>Hesap bilgileri</h3>
      <p>E-posta: ${escapeText(currentUser.email||"")}</p>
      <p class="muted">SESMOD hesabınla giriş yaptın.</p>`;
    return;
  }

  if(type==="music"){
    lastMusicPrompt="";
    $("toolContent").innerHTML=`
      <label>Şarkı adı</label>
      <input id="projectTitle" placeholder="Örn: Gurbet Yarası">
      <label>Şarkı sözleri</label>
      <textarea id="lyrics" rows="7" placeholder="Şarkı sözlerini buraya yaz..."></textarea>
      <label>Müzik tarzı</label>
      <select id="genre">
        <option>Modern Arabesk</option>
        <option>Geleneksel Türkü</option>
        <option>Anadolu Rock</option>
        <option>Psikedelik Anadolu Rock</option>
        <option>Arabesk Rock</option>
        <option>Türkçe Pop</option>
      </select>
      <label>Vokal</label>
      <select id="vocal">
        <option>Erkek vokal</option>
        <option>Kadın vokal</option>
        <option>Erkek ve kadın düet</option>
        <option>Enstrümantal</option>
      </select>
      <label>Enstrümanlar</label>
      <input id="instruments" placeholder="Bağlama, klarnet, gitar...">
      <label>Duygu ve atmosfer</label>
      <input id="mood" placeholder="Hüzünlü, etkileyici, gurbet...">
      <label>Tempo</label>
      <select id="tempo">
        <option>Yavaş</option>
        <option>Orta</option>
        <option>Hareketli</option>
      </select>
      <button class="primary full" onclick="buildMusicPrompt()">Müzik promptunu oluştur</button>
      <div id="musicResult"></div>`;
    return;
  }

  $("toolContent").innerHTML=`
    <label>Proje başlığı</label>
    <input id="projectTitle" placeholder="Projenin adı">
    <label>İsteğini anlat</label>
    <textarea id="prompt" rows="5" placeholder="İsteğini buraya yaz..."></textarea>
    <button class="primary full" onclick="saveProject('${type}')">Projeyi kaydet</button>`;
};

async function loadProjects(){
  $("toolContent").textContent="Projeler yükleniyor...";

  const {data,error}=await db.from("projects")
    .select("id,title,project_type,created_at,project_data")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    $("toolContent").textContent="Projeler yüklenemedi: "+error.message;
    return;
  }

  if(!data||data.length===0){
    $("toolContent").textContent="Henüz kayıtlı projen yok.";
    return;
  }

  $("toolContent").innerHTML=data.map(p=>`
    <div class="project">
      <b>${escapeText(p.title)}</b>
      <p class="muted">${escapeText(p.project_type||"Proje")} • ${new Date(p.created_at).toLocaleDateString("tr-TR")}</p>
      <button class="primary full" onclick="openSavedProject('${p.id}')">Projeyi aç →</button>
    </div>
  `).join("");
}

window.openSavedProject=async projectId=>{
  toolMsg("Proje açılıyor...");

  const {data,error}=await db.from("projects")
    .select("*")
    .eq("id",projectId)
    .eq("user_id",currentUser.id)
    .single();

  if(error){
    toolMsg("Proje açılamadı: "+error.message);
    return;
  }

  const p=data.project_data||{};
  const isMusic=data.project_type==="music";

  $("toolTitle").textContent=data.title;
  $("toolDescription").textContent="Kayıtlı proje ayrıntıları";

  $("toolContent").innerHTML=`
    <label>Proje adı</label>
    <input id="detailTitle" value="${escapeAttr(data.title)}">

    ${isMusic?`
      <label>Müzik promptu</label>
      <textarea id="detailPrompt" rows="7">${escapeText(p.prompt||"")}</textarea>
      <label>Şarkı sözleri</label>
      <textarea id="detailLyrics" rows="9">${escapeText(p.lyrics||"")}</textarea>
      <label>Müzik tarzı</label>
      <input id="detailGenre" value="${escapeAttr(p.genre||"")}">
      <label>Vokal</label>
      <input id="detailVocal" value="${escapeAttr(p.vocal||"")}">
      <label>Enstrümanlar</label>
      <input id="detailInstruments" value="${escapeAttr(p.instruments||"")}">
      <label>Duygu</label>
      <input id="detailMood" value="${escapeAttr(p.mood||"")}">
      <label>Tempo</label>
      <input id="detailTempo" value="${escapeAttr(p.tempo||"")}">
    `:`
      <label>Proje açıklaması</label>
      <textarea id="detailPrompt" rows="8">${escapeText(p.prompt||"")}</textarea>
    `}

    <div class="actions">
      <button class="primary" onclick="updateSavedProject('${data.id}','${data.project_type}')">Değişiklikleri kaydet</button>
      <button class="danger" onclick="deleteSavedProject('${data.id}')">Projeyi sil</button>
    </div>
    <button class="secondary full" onclick="openTool('projects')">← Projelerime dön</button>
  `;
  toolMsg("");
};

window.updateSavedProject=async(id,type)=>{
  const title=$("detailTitle").value.trim();
  if(!title){toolMsg("Proje adı boş olamaz.");return}

  let projectData={prompt:$("detailPrompt").value};

  if(type==="music"){
    projectData={
      prompt:$("detailPrompt").value,
      lyrics:$("detailLyrics").value,
      genre:$("detailGenre").value,
      vocal:$("detailVocal").value,
      instruments:$("detailInstruments").value,
      mood:$("detailMood").value,
      tempo:$("detailTempo").value
    };
  }

  toolMsg("Değişiklikler kaydediliyor...");

  const {error}=await db.from("projects").update({
    title,
    project_data:projectData
  }).eq("id",id).eq("user_id",currentUser.id);

  if(error){toolMsg("Kayıt hatası: "+error.message);return}
  toolMsg("Proje güncellendi.");
  $("toolTitle").textContent=title;
};

window.deleteSavedProject=async id=>{
  if(!confirm("Bu projeyi silmek istediğine emin misin?"))return;

  toolMsg("Proje siliniyor...");
  const {error}=await db.from("projects").delete()
    .eq("id",id).eq("user_id",currentUser.id);

  if(error){toolMsg("Silme hatası: "+error.message);return}
  toolMsg("Proje silindi.");
  await loadProjects();
};

window.buildMusicPrompt=()=>{
  const title=$("projectTitle").value.trim();
  const lyrics=$("lyrics").value.trim();
  const genre=$("genre").value;
  const vocal=$("vocal").value;
  const instruments=$("instruments").value.trim()||"Genre-appropriate traditional and modern instruments";
  const mood=$("mood").value.trim()||"Emotional and memorable";
  const tempo=$("tempo").value;

  if(!title){toolMsg("Önce şarkı adını yaz.");return}

  lastMusicPrompt=[
    "Create an original Turkish song.",
    "Genre: "+genre+".",
    "Vocal: "+vocal+".",
    "Instruments: "+instruments+".",
    "Mood: "+mood+".",
    "Tempo: "+tempo+".",
    "Use an expressive and memorable melody.",
    "Start with vocals quickly; avoid a long instrumental intro.",
    "Use clear Turkish pronunciation and professional studio production.",
    "Do not imitate any existing artist or copyrighted song."
  ].join(" ");

  $("musicResult").innerHTML=`
    <div class="result">
      <h3>Hazır müzik promptun</h3>
      <textarea id="generatedPrompt" rows="8" readonly></textarea>
      <h3>Şarkı sözlerin</h3>
      <textarea id="generatedLyrics" rows="7" readonly></textarea>
      <button class="secondary full" onclick="copyMusicPrompt()">Promptu kopyala</button>
      <button class="primary full" style="margin-top:10px" onclick="saveMusicProject()">Projeyi kaydet</button>
      <p class="muted">Bu metni müzik üretim aracındaki açıklama alanına ekleyebilirsin.</p>
    </div>`;

  $("generatedPrompt").value=lastMusicPrompt;
  $("generatedLyrics").value=lyrics;
  toolMsg("Müzik promptun hazır.");
};

window.copyMusicPrompt=async()=>{
  const text=$("generatedPrompt")?.value||lastMusicPrompt;
  if(!text)return;
  try{
    await navigator.clipboard.writeText(text);
    toolMsg("Prompt kopyalandı.");
  }catch(err){
    toolMsg("Metni seçip kopyalayabilirsin.");
  }
};

window.saveMusicProject=async()=>{
  if(!currentUser||!connectionCheck())return;

  const title=$("projectTitle").value.trim();
  const lyrics=$("lyrics").value.trim();
  if(!title||!lastMusicPrompt){
    toolMsg("Önce şarkı adını yazıp promptu oluştur.");
    return;
  }

  toolMsg("Proje kaydediliyor...");

  const {error}=await db.from("projects").insert({
    user_id:currentUser.id,
    title,
    project_type:"music",
    project_data:{
      prompt:lastMusicPrompt,
      lyrics,
      genre:$("genre").value,
      vocal:$("vocal").value,
      instruments:$("instruments").value,
      mood:$("mood").value,
      tempo:$("tempo").value
    },
    status:"draft"
  });

  toolMsg(error?"Kayıt hatası: "+error.message:"Müzik projen kaydedildi!");
};

window.saveProject=async type=>{
  if(!currentUser||!connectionCheck())return;

  const title=$("projectTitle").value.trim();
  const prompt=$("prompt").value.trim();

  if(!title||!prompt){
    toolMsg("Proje başlığı ve açıklaması gerekli.");
    return;
  }

  toolMsg("Kaydediliyor...");

  const {error}=await db.from("projects").insert({
    user_id:currentUser.id,
    title,
    project_type:type,
    project_data:{prompt},
    status:"draft"
  });

  toolMsg(error?"Kayıt hatası: "+error.message:"Projen kaydedildi!");
};

window.closeTool=()=>{
  $("editor").classList.add("hidden");
};

function escapeText(s){
  return String(s??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function escapeAttr(s){return escapeText(s)}

try{
  if(window.supabase&&window.supabase.createClient){
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    db.auth.getSession().then(({data,error})=>{
      if(error){msg(error.message);return}
      if(data.session?.user)showDashboard(data.session.user);
    }).catch(err=>msg(err.message));

    db.auth.onAuthStateChange((event,session)=>{
      if(event==="SIGNED_OUT")showLogin();
      else if(session?.user)showDashboard(session.user);
    });
  }else{
    msg("Supabase kütüphanesi yüklenemedi. Sayfayı yenile.");
  }
}catch(err){
  msg("Bağlantı hatası: "+err.message);
}
</script>
</body>
</html>
