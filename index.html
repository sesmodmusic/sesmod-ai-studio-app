
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#f7f5ff;font-family:system-ui,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #302c40}
.logo{font-size:21px;font-weight:900;letter-spacing:3px}
.logo small{display:block;font-size:10px;color:#a78bfa;letter-spacing:4px}
#auth{max-width:440px;margin:40px auto;padding:20px}
.panel{background:#1b1a27;border:1px solid #373248;border-radius:17px;padding:20px}
input,textarea,select{width:100%;padding:13px;margin:8px 0 14px;background:#101018;color:white;border:1px solid #484158;border-radius:10px}
textarea{resize:vertical}
button.primary{background:linear-gradient(100deg,#7655e8,#a05eea);color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700}
button.secondary{background:#302a43;color:white;border:1px solid #554a70;border-radius:10px;padding:11px}
button.danger{background:#512b39;color:#fff;border:1px solid #8c4058;border-radius:10px;padding:11px}
.full{width:100%;margin-top:8px}
.tabs{display:flex;gap:8px;margin:15px 0}
.tabs button{flex:1}
#workspace{max-width:950px;margin:auto;padding:20px}
.welcome{padding:24px 4px}
.welcome h1{font-size:27px;margin-bottom:5px}
.muted{color:#aaa5bb;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{background:#1b1a27;border:1px solid #373248;border-radius:15px;padding:18px;text-align:left;color:white;min-height:120px}
.tool b{display:block;margin:10px 0 5px;font-size:16px}
.tool span{color:#aaa5bb;font-size:12px}
.symbol{font-size:25px}
#editor{margin-top:20px}
#message,#toolMessage{color:#c5b5ff;font-size:13px;min-height:20px;margin:10px 0}
.project{background:#242132;border:1px solid #393348;border-radius:12px;padding:14px;margin:10px 0}
.project button{margin-top:8px}
.hidden{display:none!important}
footer{text-align:center;color:#777185;font-size:11px;padding:25px}
.result{background:#101018;border:1px solid #484158;border-radius:10px;padding:14px;margin-top:15px;overflow-wrap:anywhere}
.result h3{margin-top:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
a{color:#c5b5ff}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<div class="logo">SESMOD<small>AI STUDIO</small></div>
<button class="secondary hidden" id="logout">Çıkış Yap</button>

<section id="auth">

<form id="authForm">

<button type="submit" class="primary full" id="submit">Giriş Yap</button>
</form>

</div>
</section>

<main id="workspace" class="hidden">
<div class="welcome" id="welcome">

🎁 Deneme kredilerin yükleniyor...

<h3>Yapay zekâ araçları</h3>
<div class="grid">
<button class="tool" onclick="openTool('music')">
<div class="symbol">🎵</div><b>AI Müzik</b>
<span>Şarkı ve müzik üretim hazırlığı</span>

<div class="symbol">🎨</div><b>AI Görsel</b>
<span>Gerçek yapay zekâ görsel üretimi</span>

<div class="symbol">🎬</div><b>AI Video</b>

<div class="symbol">📁</div><b>Projelerim</b>

<div class="symbol">👤</div><b>Hesabım</b>

<script>
const SUPABASE_URL="https://izlwpgepxyzzzsvfcuph.supabase.co";
const SUPABASE_KEY="sb_publishable_1tRMEPEDJgHb3rz1PF4lag_2Um3_jZl";

let db=null;
let mode="login";
let currentUser=null;
let lastMusicPrompt="";
let editingProjectId=null;

const $=id=>document.getElementById(id);

function msg(t){$("message").textContent=t}
function toolMsg(t){$("toolMessage").textContent=t}

function connectionCheck(){
  if(!db){
    msg("Bağlantı kurulamadı. Sayfayı yenile.");
    return false;
  }
  return true;
}

async function showDashboard(user){
  currentUser=user;
  $("auth").classList.add("hidden");
  $("workspace").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("welcomeEmail").textContent=user.email||"";
  await loadCredits();
}

async function loadCredits(){
  if(!currentUser)return;

  const {data,error}=await db
    .from("user_credits")
    .select("credits")
    .eq("user_id",currentUser.id)
    .single();

  const balance=$("creditBalance");

  if(error){
    balance.textContent="Kredi bilgisi yüklenemedi: "+error.message;
    return;
  }

  balance.innerHTML="🎁 Kalan deneme kredin: <b>"+data.credits+"</b>";
}

function showLogin(){
  currentUser=null;
  $("workspace").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("auth").classList.remove("hidden");
}

$("loginTab").onclick=()=>{
  mode="login";
  $("submit").textContent="Giriş Yap";
  msg("");
};

$("signupTab").onclick=()=>{
  mode="signup";
  $("submit").textContent="Hesap Oluştur";
  msg("");
};

$("googleLogin").onclick=async()=>{
  if(!connectionCheck())return;

  msg("Google giriş sayfası açılıyor...");

  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:window.location.origin}
  });

  if(error)msg(error.message);
};

$("authForm").onsubmit=async e=>{
  e.preventDefault();
  if(!connectionCheck())return;

  $("submit").disabled=true;
  msg("İşlem yapılıyor...");

  try{
    const email=$("email").value.trim();
    const password=$("password").value;

    const result=mode==="signup"
      ?await db.auth.signUp({email,password})
      :await db.auth.signInWithPassword({email,password});

    if(result.error)throw result.error;

    if(mode==="signup"&&!result.data.session){
      msg("Kayıt oluşturuldu. E-postanı doğrula, ardından giriş yap.");
    }else if(result.data.user){
      await showDashboard(result.data.user);
    }
  }catch(err){
    msg(err.message||"Bir hata oluştu.");
  }finally{
    $("submit").disabled=false;
  }
};

$("logout").onclick=async()=>{
  if(!connectionCheck())return;

  const {error}=await db.auth.signOut();

  if(error){
    msg(error.message);
    return;
  }

  showLogin();
};

const tools={
  music:["AI Müzik","Şarkını oluşturmak için bilgileri doldur."],
  lyrics:["AI Şarkı Yazarı","Şarkı yazım projenin konusunu anlat."],
  image:["AI Görsel","Yapay zekâ ile gerçek görsel oluştur."],
  video:["AI Video","Oluşturmak istediğin videoyu tarif et."],
  projects:["Projelerim","Hesabına kaydedilen projeler."],
  account:["Hesabım","SESMOD hesap bilgilerin."]
};

window.openTool=async type=>{
  if(!currentUser||!connectionCheck()||!tools[type])return;

  editingProjectId=null;
  $("editor").classList.remove("hidden");
  $("toolTitle").textContent=tools[type][0];
  $("toolDescription").textContent=tools[type][1];
  $("toolContent").innerHTML="";
  toolMsg("");

  if(type==="projects"){
    await loadProjects();
    return;
  }

  if(type==="account"){
    $("toolContent").innerHTML=`
      <div class="result">
        <h3>Hesap bilgileri</h3>
        <p>E-posta: ${escapeText(currentUser.email||"")}</p>
        <p class="muted">SESMOD AI STUDIO hesabın.</p>
      </div>`;
    return;
  }

  if(type==="music"){
    $("toolContent").innerHTML=`
      <label>Şarkı adı</label>
      <input id="projectTitle" placeholder="Örn: Gurbet Yarası">

      <label>Şarkı sözleri</label>
      <textarea id="lyrics" rows="7" placeholder="Şarkı sözlerini buraya yaz..."></textarea>

      <label>Müzik tarzı</label>
      <select id="genre">
        <option>Modern Arabesk</option>
        <option>Geleneksel Türkü</option>
        <option>Anadolu Rock</option>
        <option>Psikedelik Anadolu Rock</option>
        <option>Arabesk Rock</option>
        <option>Türkçe Pop</option>
      </select>

      <label>Vokal</label>
      <select id="vocal">
        <option>Erkek vokal</option>
        <option>Kadın vokal</option>
        <option>Erkek ve kadın düet</option>
        <option>Enstrümantal</option>
      </select>

      <label>Enstrümanlar</label>
      <input id="instruments" placeholder="Bağlama, klarnet, gitar...">

      <label>Duygu ve atmosfer</label>
      <input id="mood" placeholder="Hüzünlü, etkileyici, gurbet...">

      <label>Tempo</label>
      <select id="tempo">
        <option>Yavaş</option>
        <option>Orta</option>
        <option>Hareketli</option>
      </select>

      <button class="primary full" onclick="buildMusicPrompt()">Müzik promptunu oluştur</button>
      <div id="musicResult"></div>`;
    return;
  }

  if(type==="image"){
    $("toolContent").innerHTML=`
      <label>Proje başlığı</label>
      <input id="projectTitle" placeholder="Örn: SESMOD albüm kapağı">

      <label>Görsel açıklaması</label>
      <textarea id="prompt" rows="5" placeholder="Nasıl bir görsel istiyorsun? Örneğin: Gün batımında sinematik bir Türk manzarası..."></textarea>

      <p class="muted">Başarılı görsel üretimi 5 SESMOD deneme kredisi kullanır.</p>

      <button class="primary full" id="generateImageButton" onclick="generateImage()">🎨 Gerçek görsel üret</button>

      <div id="imageResult"></div>`;
    return;
  }

  $("toolContent").innerHTML=`
    <label>Proje başlığı</label>
    <input id="projectTitle" placeholder="Projenin adı">

    <label>İsteğini anlat</label>
    <textarea id="prompt" rows="5" placeholder="İsteğini buraya yaz..."></textarea>

    <button class="primary full" onclick="saveProject('${type}')">Projeyi kaydet</button>`;
};

async function loadProjects(){
  $("toolContent").textContent="Projeler yükleniyor...";

  const {data,error}=await db.from("projects")
    .select("id,title,project_type,project_data,created_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    $("toolContent").textContent="Projeler yüklenemedi: "+error.message;
    return;
  }

  if(!data||data.length===0){
    $("toolContent").textContent="Henüz kayıtlı projen yok.";
    return;
  }

  $("toolContent").innerHTML=data.map(p=>`
    <div class="project">
      <b>${escapeText(p.title)}</b>
      <p class="muted">${escapeText(p.project_type||"Proje")} • ${new Date(p.created_at).toLocaleDateString("tr-TR")}</p>
      <button class="primary" onclick="openSavedProject('${p.id}')">Projeyi aç</button>
    </div>`).join("");
}

window.openSavedProject=async id=>{
  const {data,error}=await db.from("projects")
    .select("id,title,project_type,project_data")
    .eq("id",id)
    .eq("user_id",currentUser.id)
    .single();

  if(error){
    toolMsg("Proje açılamadı: "+error.message);
    return;
  }

  if(!data)return;

  editingProjectId=data.id;
  const projectData=data.project_data||{};

  $("toolTitle").textContent=data.title;
  $("toolDescription").textContent="Kayıtlı proje bilgileri.";

  $("toolContent").innerHTML=`
    <label>Proje başlığı</label>
    <input id="editTitle" value="${escapeAttr(data.title)}">

    <label>Proje açıklaması / prompt</label>
    <textarea id="editPrompt" rows="7">${escapeText(projectData.prompt||projectData.lyrics||"")}</textarea>

    ${projectData.image_url?'<img src="'+escapeAttr(projectData.image_url)+'" style="width:100%;border-radius:12px" alt="Kaydedilen görsel">':''}

    <div class="actions">
      <button class="primary" onclick="updateProject()">Değişiklikleri kaydet</button>
      <button class="danger" onclick="deleteProject()">Projeyi sil</button>
    </div>

    <button class="secondary full" onclick="openTool('projects')">← Projelerime dön</button>`;
};

window.updateProject=async()=>{
  if(!editingProjectId)return;

  const title=$("editTitle").value.trim();
  const prompt=$("editPrompt").value.trim();

  if(!title){
    toolMsg("Proje başlığı boş olamaz.");
    return;
  }

  const {data:old,error:readError}=await db.from("projects")
    .select("project_data")
    .eq("id",editingProjectId)
    .eq("user_id",currentUser.id)
    .single();

  if(readError){
    toolMsg("Proje okunamadı: "+readError.message);
    return;
  }

  const updatedData={...(old.project_data||{}),prompt};

  const {error}=await db.from("projects")
    .update({title,project_data:updatedData})
    .eq("id",editingProjectId)
    .eq("user_id",currentUser.id);

  toolMsg(error?"Güncelleme hatası: "+error.message:"Projen güncellendi!");
};

window.deleteProject=async()=>{
  if(!editingProjectId)return;

  if(!confirm("Bu projeyi silmek istediğine emin misin?"))return;

  const {error}=await db.from("projects")
    .delete()
    .eq("id",editingProjectId)
    .eq("user_id",currentUser.id);

  if(error){
    toolMsg("Silme hatası: "+error.message);
    return;
  }

  editingProjectId=null;
  toolMsg("Proje silindi.");
  await loadProjects();
};

window.buildMusicPrompt=()=>{
  const title=$("projectTitle").value.trim();
  const lyrics=$("lyrics").value.trim();
  const genre=$("genre").value;
  const vocal=$("vocal").value;
  const instruments=$("instruments").value.trim()||"Genre-appropriate instruments";
  const mood=$("mood").value.trim()||"Emotional and memorable";
  const tempo=$("tempo").value;

  if(!title){
    toolMsg("Önce şarkı adını yaz.");
    return;
  }

  lastMusicPrompt=[
    "Create an original Turkish song.",
    "Genre: "+genre+".",
    "Vocal: "+vocal+".",
    "Instruments: "+instruments+".",
    "Mood: "+mood+".",
    "Tempo: "+tempo+".",
    "Use an expressive and memorable melody.",
    "Start with vocals quickly; avoid a long instrumental intro.",
    "Use clear Turkish pronunciation and professional studio production.",
    "Do not imitate any existing artist or copyrighted song."
  ].join(" ");

  $("musicResult").innerHTML=`
    <div class="result">
      <h3>Hazır müzik promptun</h3>
      <textarea id="generatedPrompt" rows="8" readonly></textarea>

      <h3>Şarkı sözlerin</h3>
      <textarea id="generatedLyrics" rows="7" readonly></textarea>

      <button class="secondary full" onclick="copyMusicPrompt()">Promptu kopyala</button>
      <button class="primary full" onclick="saveMusicProject()">Projeyi kaydet</button>

      <p class="muted">Bu metni müzik üretim aracında kullanabilirsin.</p>
    </div>`;

  $("generatedPrompt").value=lastMusicPrompt;
  $("generatedLyrics").value=lyrics;
  toolMsg("Müzik promptun hazır.");
};

window.copyMusicPrompt=async()=>{
  const text=$("generatedPrompt")?.value||lastMusicPrompt;
  if(!text)return;

  try{
    await navigator.clipboard.writeText(text);
    toolMsg("Prompt kopyalandı.");
  }catch(err){
    toolMsg("Metni seçip kopyalayabilirsin.");
  }
};

window.saveMusicProject=async()=>{
  if(!currentUser||!connectionCheck())return;

  const title=$("projectTitle").value.trim();
  const lyrics=$("lyrics").value.trim();

  if(!title||!lastMusicPrompt){
    toolMsg("Önce şarkı adını yazıp promptu oluştur.");
    return;
  }

  toolMsg("Proje kaydediliyor...");

  const {error}=await db.from("projects").insert({
    user_id:currentUser.id,
    title,
    project_type:"music",
    project_data:{
      prompt:lastMusicPrompt,
      lyrics,
      genre:$("genre").value,
      vocal:$("vocal").value,
      instruments:$("instruments").value.trim(),
      mood:$("mood").value.trim(),
      tempo:$("tempo").value
    },
    status:"draft"
  });

  toolMsg(error?"Kayıt hatası: "+error.message:"Müzik projen kaydedildi!");
};

window.generateImage=async()=>{
  if(!currentUser||!connectionCheck())return;

  const title=$("projectTitle").value.trim();
  const prompt=$("prompt").value.trim();
  const result=$("imageResult");
  const button=$("generateImageButton");

  if(!title||!prompt){
    toolMsg("Proje başlığı ve görsel açıklaması gerekli.");
    return;
  }

  button.disabled=true;
  button.textContent="Görsel hazırlanıyor...";
  result.innerHTML='<div class="result">Görselin hazırlanıyor. Lütfen bu sayfayı kapatma.</div>';
  toolMsg("Görsel üretim isteği gönderiliyor...");

  try{
    const {data:sessionData,error:sessionError}=await db.auth.getSession();

    if(sessionError)throw sessionError;

    if(!sessionData.session){
      throw new Error("Oturum bulunamadı. Lütfen yeniden giriş yap.");
    }

    const response=await fetch(
      SUPABASE_URL+"/functions/v1/sesmod-generate",
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer "+sessionData.session.access_token,
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({prompt})
      }
    );

    const payload=await response.json();

    if(!response.ok||!payload.success){
      throw new Error(payload.error||"Görsel üretilemedi.");
    }

    const {error:saveError}=await db.from("projects").insert({
      user_id:currentUser.id,
      title,
      project_type:"image",
      project_data:{
        prompt,
        image_url:payload.image_url
      },
      status:"completed"
    });

    result.innerHTML=`
      <div class="result">
        <h3>Görselin hazır! 🎉</h3>
        <img src="${escapeAttr(payload.image_url)}"
             alt="Üretilen görsel"
             style="width:100%;border-radius:12px">

        <p>Kullanılan kredi: <b>${escapeText(payload.credits_spent??5)}</b></p>
        <p>Kalan kredi: <b>${escapeText(payload.remaining_credits??"")}</b></p>

        <a href="${escapeAttr(payload.image_url)}"
           target="_blank"
           rel="noopener">Görseli yeni sekmede aç</a>

        ${saveError
          ?'<p class="muted">Görsel üretildi ancak proje kaydı yapılamadı: '+escapeText(saveError.message)+'</p>'
          :'<p class="muted">Görsel projen kaydedildi.</p>'}
      </div>`;

    await loadCredits();
    toolMsg("Görsel başarıyla üretildi.");

  }catch(error){
    result.innerHTML=`
      <div class="result">
        <h3>Üretim tamamlanamadı</h3>
        <p>${escapeText(error.message)}</p>
      </div>`;

    toolMsg("Görsel üretimi başarısız. İşlem başarısızsa kredi düşülmemelidir.");

  }finally{
    button.disabled=false;
    button.textContent="🎨 Gerçek görsel üret";
  }
};

window.saveProject=async type=>{
  if(!currentUser||!connectionCheck())return;

  const title=$("projectTitle").value.trim();
  const prompt=$("prompt").value.trim();

  if(!title||!prompt){
    toolMsg("Proje başlığı ve açıklaması gerekli.");
    return;
  }

  toolMsg("Kaydediliyor...");

  const {error}=await db.from("projects").insert({
    user_id:currentUser.id,
    title,
    proje
